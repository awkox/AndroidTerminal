name: 发布

on:
  push:
    tags:
      - 'v*'

concurrency:
  # 发布任务不可被后续事件取消
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # 创建 GitHub Release
  contents: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    env:
      # secrets 不能出现在 if 条件中，先解析为 job 级环境变量布尔值
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_GZ_B64 != '' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 配置 Gradle（依赖/构建缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 校验 tag 与发布版本一致
        # Maven Central 版本不可覆盖：打错 tag 会把错误版本永久占号，发布前从数据源（build 文件）拦截
        run: |
          VERSION=$(grep -oP 'coordinates\("[^"]+", "[^"]+", "\K[^"]+' libterminal/build.gradle.kts)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME 与 libterminal/build.gradle.kts 版本 $VERSION 不一致" >&2
            exit 1
          fi

      - name: 单元测试
        # 不发布带回归的版本
        run: ./gradlew --build-cache :libterminal:testDebugUnitTest

      - name: 解密KeyStore
        # 无 secrets 时跳过 release 包，Release 只附 debug
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_GZ_B64 }}" \
            | base64 --decode \
            | gunzip > app/release.keystore
          ACTUAL_SHA=$(sha256sum app/release.keystore | awk '{print $1}')
          EXPECTED_SHA=${{ secrets.KEYSTORE_EXPECTED_SHA256 }}
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              exit 1
          fi

      - name: 构建 APK
        # 放在 Maven Central 之前：本地可验证动作全绿才占用不可逆的中央仓库版本号
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          ./gradlew --build-cache :app:assembleDebug
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew --build-cache :app:assembleRelease
          fi

      - name: 发布并 release 到 Maven Central
        # publishAndReleaseToMavenCentral：上传 deployment + 自动 release + 轮询校验终态（失败即中止）
        run: ./gradlew --build-cache :libterminal:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: 创建 GitHub Release
        # notes 自动生成；Maven Central 失败则本步骤不执行（串行 gate）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(app/build/outputs/apk/debug/app-debug.apk)
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ASSETS+=(app/build/outputs/apk/release/app-release.apk)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "AndroidTerminal $GITHUB_REF_NAME" \
              --generate-notes
          fi
